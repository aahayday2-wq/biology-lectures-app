<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ أحمد البايولوجي</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1B2B3F;
            --blue: #2A4365;
            --gold: #D69E2E;
            --bg: #F7FAFC;
            --card-bg: #FFFFFF;
            --text: #2D3748;
            --border: #E2E8F0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: var(--navy);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.1rem;
            color: var(--blue);
            margin: 20px 0 10px 0;
            border-right: 4px solid var(--gold);
            padding-right: 8px;
        }
        .card {
            background: #FFF;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: #38A169;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="container">

        <p class="subtitle">منصة تعليمية وخدمات إبداعية</p>
